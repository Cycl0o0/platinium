<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platinium · OpenDeezer — Settings</title>
  <link rel="stylesheet" href="panel.css">
  <style>
    main.options { max-width: 480px; margin: 0 auto; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    .field input {
      width: 100%;
      padding: 8px 12px;
      border-radius: var(--radius);
      border: 1px solid rgba(128, 128, 160, 0.3);
      background: var(--panel);
      color: var(--text);
    }
    .field input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .row { display: flex; gap: 10px; align-items: center; }
    .btn {
      border: none;
      border-radius: var(--radius);
      padding: 9px 18px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
    }
    .btn.ghost { background: var(--panel); color: var(--text); }
    #feedback { font-size: 13px; }
    #feedback.ok { color: #4caf7d; }
    #feedback.err { color: var(--danger); }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand">OpenDeezer — Settings</span>
  </header>

  <main class="options">
    <div class="field">
      <label for="baseUrl">Control server base URL</label>
      <input id="baseUrl" type="url" placeholder="http://127.0.0.1:7654">
      <p class="hint">
        Mirrors <code>OPENDEEZER_URL</code>. Default is
        <code>http://127.0.0.1:7654</code> (the SDK control server, possibly
        reached through an SSH tunnel).
      </p>
    </div>

    <div class="field">
      <label for="token">Bearer token (optional)</label>
      <input id="token" type="password" placeholder="leave empty if no auth">
      <p class="hint">
        Mirrors <code>OPENDEEZER_TOKEN</code>. Sent as
        <code>Authorization: Bearer &lt;token&gt;</code> on every request.
      </p>
    </div>

    <div class="row">
      <button id="save" class="btn">Save</button>
      <button id="test" class="btn ghost">Test connection</button>
      <span id="feedback"></span>
    </div>
  </main>

  <footer class="foot">
    <span class="credit">Platinium by Cycl0o0 · AGPL-3.0</span>
  </footer>

  <script src="options.js"></script>
</body>
</html>
